<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A424B" />
      <stop offset="100%" stop-color="#0B1E22" />
    </linearGradient>
    <linearGradient id="favSweep" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F3A03B" stop-opacity="0" />
      <stop offset="100%" stop-color="#F3A03B" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- Circular Radar Body -->
  <circle cx="32" cy="32" r="30" fill="url(#favBg)" stroke="#F3A03B" stroke-width="1.8" />

  <!-- Radar Rings -->
  <circle cx="32" cy="32" r="10" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
  <circle cx="32" cy="32" r="20" fill="none" stroke="rgba(79, 209, 197, 0.35)" stroke-width="1.2" />

  <!-- Axis Lines -->
  <line x1="32" y1="2" x2="32" y2="62" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
  <line x1="2" y1="32" x2="62" y2="32" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />

  <!-- Sweep Wedge -->
  <path d="M 32 32 L 53 11 A 30 30 0 0 0 32 2 Z" fill="url(#favSweep)" />
  <line x1="32" y1="32" x2="53" y2="11" stroke="#F3A03B" stroke-width="2" stroke-linecap="round" />

  <!-- Blip -->
  <circle cx="46" cy="18" r="2.8" fill="#F3A03B" />
  <circle cx="46" cy="18" r="1.2" fill="#FFFFFF" />

  <!-- Center Target Core -->
  <circle cx="32" cy="32" r="6" fill="#14363D" stroke="#F3A03B" stroke-width="1.5" />
  <!-- Currency Tick -->
  <circle cx="32" cy="32" r="2.2" fill="#FFFFFF" />
</svg>